# Local development (and the shape of staging/production): PostgreSQL, the
# migrations, the API. Run from the repository root:
#   docker compose -f infra/compose.yaml up --build
# Secrets come from infra/.env (never committed; see infra/env.example).
name: gnosis
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gnosis
      POSTGRES_USER: gnosis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gnosis -d gnosis"]
      interval: 5s
      retries: 20
    ports: ["127.0.0.1:5432:5432"]          # local only, never public
  migrate:
    build: {context: .., dockerfile: backend/Dockerfile}
    command: ["alembic", "upgrade", "head"]
    environment:
      GNOSIS_DATABASE_URL: postgresql+psycopg://gnosis:${POSTGRES_PASSWORD}@db:5432/gnosis
    depends_on: {db: {condition: service_healthy}}
  api:
    build: {context: .., dockerfile: backend/Dockerfile}
    environment:
      GNOSIS_ENVIRONMENT: ${GNOSIS_ENVIRONMENT:-development}
      GNOSIS_DATABASE_URL: postgresql+psycopg://gnosis:${POSTGRES_PASSWORD}@db:5432/gnosis
      GNOSIS_PUBLIC_URL: ${GNOSIS_PUBLIC_URL:-http://localhost:5173}
      GNOSIS_API_URL: ${GNOSIS_API_URL:-http://localhost:8000}
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8000:8000"]
volumes:
  dbdata:
