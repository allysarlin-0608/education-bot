# The browser tests of the main journeys, every night and on demand (audit
# stage 2). The full suite (about two hours) stays a manual run; these flows
# are the ones a change most often breaks: the setup, a goal, Home, a lesson
# and its quiz, review, the menu and header, reporting a problem. No real
# database or AI: the fake Supabase and the fake model in tests/.
name: e2e-nightly
on:
  schedule:                      # (GitHub runs a schedule from the main branch only)
    - cron: "40 17 * * *"        # 01:40 in Taipei
  push:                          # and every push of code to the test branch
    branches: [dev]
    paths: ["coach/**", "views/**", "gnosis.py", "tests/**", "requirements.txt", ".github/workflows/e2e-nightly.yml"]
  workflow_dispatch:
concurrency:                     # a newer push replaces a run still going
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest playwright==1.63.0 uvicorn==0.32.1 pillow
      - run: python -m playwright install --with-deps chromium
      - name: Browser tests (main journeys)
        run: >
          python -m pytest -q -p no:cacheprovider
          tests/e2e/test_smoke.py tests/e2e/test_setup.py tests/e2e/test_setup_again.py
          tests/e2e/test_goals.py tests/e2e/test_journeys.py tests/e2e/test_today.py
          tests/e2e/test_review.py tests/e2e/test_header_menu.py tests/e2e/test_reports.py
      - name: Screenshots of what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: tests/e2e/results/failures/
          if-no-files-found: ignore
