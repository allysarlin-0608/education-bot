[theme]
font = '"Inter", "Noto Sans TC", sans-serif'
headingFont = '"Newsreader", "Noto Serif TC", serif'
baseFontSize = 15
baseRadius = "none"
buttonRadius = "none"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#1A1A1A"
backgroundColor = "#FAFAF7"
secondaryBackgroundColor = "#F0EFEB"
textColor = "#1A1A1A"
linkColor = "#1A1A1A"
borderColor = "#DEDDD8"

[theme.dark]
primaryColor = "#EDEDE8"
backgroundColor = "#0B0B0B"
secondaryBackgroundColor = "#161616"
textColor = "#EDEDE8"
linkColor = "#EDEDE8"
borderColor = "#2A2A2A"

[client]
toolbarMode = "minimal"
