[theme]
font = '"Inter", "Noto Sans TC", sans-serif'
headingFont = '"Newsreader", "Noto Serif TC", serif'
baseFontSize = 15
baseRadius = "12px"
buttonRadius = "12px"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#1A1A1A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F2F2"
textColor = "#141414"
linkColor = "#141414"
borderColor = "#D6D6D6"
codeTextColor = "#2B2B2B"
codeBackgroundColor = "#EAEAEA"
redColor = "#595959"
redBackgroundColor = "#EDEDED"
redTextColor = "#2B2B2B"
orangeColor = "#595959"
orangeBackgroundColor = "#EDEDED"
orangeTextColor = "#2B2B2B"
yellowColor = "#595959"
yellowBackgroundColor = "#EDEDED"
yellowTextColor = "#2B2B2B"
blueColor = "#595959"
blueBackgroundColor = "#EDEDED"
blueTextColor = "#2B2B2B"
greenColor = "#595959"
greenBackgroundColor = "#EDEDED"
greenTextColor = "#2B2B2B"
violetColor = "#595959"
violetBackgroundColor = "#EDEDED"
violetTextColor = "#2B2B2B"
grayColor = "#595959"
grayBackgroundColor = "#EDEDED"
grayTextColor = "#2B2B2B"
chartCategoricalColors = ["#1A1A1A", "#595959", "#8C8C8C", "#BFBFBF"]

[theme.dark]
primaryColor = "#F2F2F2"
backgroundColor = "#000000"
secondaryBackgroundColor = "#101010"
textColor = "#EDEDED"
linkColor = "#EDEDED"
borderColor = "#2B2B2B"
codeTextColor = "#D9D9D9"
codeBackgroundColor = "#141414"
redColor = "#BFBFBF"
redBackgroundColor = "#1A1A1A"
redTextColor = "#D9D9D9"
orangeColor = "#BFBFBF"
orangeBackgroundColor = "#1A1A1A"
orangeTextColor = "#D9D9D9"
yellowColor = "#BFBFBF"
yellowBackgroundColor = "#1A1A1A"
yellowTextColor = "#D9D9D9"
blueColor = "#BFBFBF"
blueBackgroundColor = "#1A1A1A"
blueTextColor = "#D9D9D9"
greenColor = "#BFBFBF"
greenBackgroundColor = "#1A1A1A"
greenTextColor = "#D9D9D9"
violetColor = "#BFBFBF"
violetBackgroundColor = "#1A1A1A"
violetTextColor = "#D9D9D9"
grayColor = "#BFBFBF"
grayBackgroundColor = "#1A1A1A"
grayTextColor = "#D9D9D9"
chartCategoricalColors = ["#F2F2F2", "#BFBFBF", "#8C8C8C", "#595959"]

[server]
enableStaticServing = true

[client]
toolbarMode = "viewer"
