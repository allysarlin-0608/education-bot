[alembic]
script_location = migrations
prepend_sys_path = . ..
file_template = %%(rev)s_%%(slug)s
# the database URL comes from the environment (GNOSIS_DATABASE_URL), never this file

[loggers]
keys = root,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s %(message)s
